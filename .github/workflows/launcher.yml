name: launcher
on:
  push:
    tags: ["launcher-v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - run: pip install . pyinstaller pytest
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Configure Microsoft client ID
        env:
          MICROSOFT_CLIENT_ID: ${{ vars.NET_MICROSOFT_CLIENT_ID }}
        run: python -c "import os; from pathlib import Path; Path('netlauncher/_build_config.py').write_text('MICROSOFT_CLIENT_ID = ' + repr(os.environ['MICROSOFT_CLIENT_ID']) + chr(10), encoding='utf-8')"
      - run: pyinstaller packaging/net-launcher.spec --noconfirm
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          } else {
            $compiler = $iscc.Source
          }
          $version = python -c "import netlauncher; print(netlauncher.__version__)"
          & $compiler "/DLauncherVersion=$version" packaging/windows.iss
          exit $LASTEXITCODE
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          install -m 644 packaging/icon.png dist/net-launcher/launcher-icon.png
          tar -C dist -czf NET-Launcher-linux.tar.gz net-launcher
          cat packaging/linux-installer.sh NET-Launcher-linux.tar.gz > NET-Launcher-Linux-Setup.sh
          chmod +x NET-Launcher-Linux-Setup.sh
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications
          cp -a dist/net-launcher/. AppDir/usr/bin/
          cp netlauncher/ui/assets/icon/icon.png AppDir/net-launcher.png
          cat > AppDir/net-launcher.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=.NET Launcher
          Exec=net-launcher
          Icon=net-launcher
          Terminal=false
          Categories=Game;
          DESKTOP
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 LDAI_OUTPUT=NET-Launcher-x86_64.AppImage \
            LINUXDEPLOY_OUTPUT_VERSION="${GITHUB_REF_NAME#launcher-v}" \
            ./linuxdeploy-x86_64.AppImage --appdir AppDir \
              --executable AppDir/usr/bin/net-launcher \
              --desktop-file AppDir/net-launcher.desktop \
              --icon-file AppDir/net-launcher.png --output appimage
      - name: Keep Windows download
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: launcher-Windows
          path: launcher/dist/NET-Launcher-Setup.exe
          if-no-files-found: error
      - name: Keep Linux downloads
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: launcher-Linux
          path: |
            launcher/NET-Launcher-linux.tar.gz
            launcher/NET-Launcher-Linux-Setup.sh
            launcher/NET-Launcher-x86_64.AppImage
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/launcher-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          path: downloads
          merge-multiple: true
      - name: Read the launcher version
        id: version
        run: echo "number=${GITHUB_REF_NAME#launcher-v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: .NET Launcher ${{ steps.version.outputs.number }}
          body_path: CHANGELOG.md
          prerelease: ${{ contains(steps.version.outputs.number, '-') }}
          make_latest: ${{ contains(steps.version.outputs.number, '-') && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            downloads/NET-Launcher-Setup.exe
            downloads/NET-Launcher-Linux-Setup.sh
            downloads/NET-Launcher-x86_64.AppImage
            downloads/NET-Launcher-linux.tar.gz
