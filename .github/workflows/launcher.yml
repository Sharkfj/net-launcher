name: launcher
on:
  push:
    tags: ["launcher-v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - run: pip install . pyinstaller pytest
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: pyinstaller packaging/net-launcher.spec --noconfirm
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf NET-Launcher-linux.tar.gz net-launcher
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        with:
          make_latest: false
          fail_on_unmatched_files: false
          files: |
            launcher/dist/NET-Launcher.exe
            launcher/NET-Launcher-linux.tar.gz
