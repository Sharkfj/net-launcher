[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netlauncher"
dynamic = ["version"]
description = ".NET Minecraft pack launcher"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7", "minecraft-launcher-lib==8.0", "requests>=2.31", "markdown>=3.5"]

[project.scripts]
net-launcher = "netlauncher.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "netlauncher.__version__"}

[tool.setuptools.packages.find]
include = ["netlauncher*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
